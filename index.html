<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akshaya Patr</title>
  </head>
  <body>
    <!-- Top: name, tagline, live impact counter -->
    <header>
      <div>
        <h1>🍛 Akshaya Patr</h1>
        <p class="tag">Leftover food → hungry workers, before it goes to waste</p>
      </div>
      <div id="impact"></div>
      <button id="reset" title="Reset demo data">↺ Reset demo</button>
    </header>

    <!-- Three roles -->
    <nav id="tabs">
      <button data-role="donor">🍽️ Donor</button>
      <button data-role="camp">🏗️ Labour camp</button>
      <button data-role="volunteer">🙋 Volunteer</button>
    </nav>

    <!-- Left: the role's screen. Right: the map. -->
    <main>
      <section id="panel"></section>
      <div id="map"></div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
