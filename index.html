<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akshaya Patr</title>
  </head>
  <body>
    <!-- Top: name, tagline, live impact counter, language, theme, reset -->
    <header>
      <div>
        <h1>Akshaya Patr</h1>
        <p class="tag" id="tagline"></p>
      </div>
      <div id="impact"></div>
      <div class="controls">
        <select id="lang" aria-label="Language"></select>
        <button id="joinBtn"></button>
        <button id="theme" aria-label="Switch light/dark theme"></button>
        <button id="reset"></button>
      </div>
    </header>

    <!-- Three roles -->
    <nav id="tabs">
      <button data-role="donor"></button>
      <button data-role="camp"></button>
      <button data-role="volunteer"></button>
    </nav>

    <!-- The role's screen + the map -->
    <main>
      <section id="panel"></section>
      <div id="map"></div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
